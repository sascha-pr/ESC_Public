<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Probetraining-App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine Handy-Spalte im Vereinslook ESC 06; schwarzer Kopf mit roter Kante und Wappen, Karten wie News-Kacheln, feste Aktionsleiste unten */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --fg:#141414; --muted:#5f5f64; --line:#e1e1e4; --line-strong:#c9c9ce;
  --pitch:#141414; --pitch-ink:#ffffff; --chalk:rgba(255,255,255,.08); --on-pitch-chip:rgba(255,255,255,.1);
  --brand:#c9252b; --brand-ink:#ffffff;
  --sig-red:#ff4a5c; --sig-amber:#ffc24d; --sig-green:#3fc78a; --sig-probe:#ffffff;
  --accent:#c9252b; --accent-ink:#ffffff; --accent-soft:#fbe8e8; --focus:#c9252b;
  --red:#b0101f; --red-bg:#fde6e8; --amber:#8a5a0c; --amber-bg:#fbf0d6; --green:#006f45; --green-bg:#e0f1e8;
  --probe:#141414; --probe-bg:#ebebee;
  --qr-bg:#ffffff; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.06);
  --radius:6px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f10; --surface:#1b1b1d; --fg:#ededee; --muted:#a3a3a9; --line:#2c2c30; --line-strong:#3e3e44;
  --pitch:#000000; --pitch-ink:#ffffff; --chalk:rgba(255,255,255,.07);
  --accent:#de3a40; --accent-ink:#ffffff; --accent-soft:#3a1418; --focus:#ff6b7a;
  --red:#ff7180; --red-bg:#3a1418; --amber:#e9b45d; --amber-bg:#36290f; --green:#6fd295; --green-bg:#163021;
  --probe:#ededee; --probe-bg:#2c2c30;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f0f10; --surface:#1b1b1d; --fg:#ededee; --muted:#a3a3a9; --line:#2c2c30; --line-strong:#3e3e44;
  --pitch:#000000; --pitch-ink:#ffffff; --chalk:rgba(255,255,255,.07);
  --accent:#de3a40; --accent-ink:#ffffff; --accent-soft:#3a1418; --focus:#ff6b7a;
  --red:#ff7180; --red-bg:#3a1418; --amber:#e9b45d; --amber-bg:#36290f; --green:#6fd295; --green-bg:#163021;
  --probe:#ededee; --probe-bg:#2c2c30;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Kopf */
.top{background:var(--pitch);color:var(--pitch-ink);position:relative;overflow:hidden;border-bottom:5px solid var(--brand)}
.crest{width:52px;height:52px;border-radius:50%;background:#fff;flex:none;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.top::before{content:"";position:absolute;width:230px;height:230px;border:2px solid var(--chalk);border-radius:50%;right:-95px;top:50%;transform:translateY(-50%)}
.top::after{content:"";position:absolute;right:19px;top:0;bottom:0;border-left:2px solid var(--chalk)}
.hdr-in{position:relative;z-index:1;padding-block:18px 20px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding-right:110px}
h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:.95;margin:12px 0 6px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{font-size:15px;opacity:.86}
.logout{position:absolute;top:13px;right:0;background:transparent;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--pitch-ink)}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tchip{display:inline-flex;align-items:center;gap:7px;background:var(--on-pitch-chip);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.d{width:9px;height:9px;border-radius:50%;display:inline-block}
.d-red{background:var(--sig-probe)} .d-amber{background:var(--sig-amber)} .d-green{background:var(--sig-green)}
.d-stop{background:var(--sig-red);border-radius:2px}

/* Inhalt */
main{padding-block:20px calc(120px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:26px}
section{display:grid;gap:10px}
.sec{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:8px}
.sec::before{content:"";width:4px;height:17px;background:var(--brand);align-self:center}
.sec .n{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.secsub{font-size:14px;color:var(--muted);margin-top:-6px}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card.is-limit{border-color:var(--red);border-width:2px;padding:15px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-head > div{min-width:0}
.name{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.02}
.meta{font-size:14px;color:var(--muted);margin-top:3px}
.pill{font-size:12px;font-weight:700;padding:5px 8px;border-radius:3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-probe{background:var(--probe-bg);color:var(--probe)}
.t-stop{background:var(--red);color:var(--surface)}
.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-green{background:var(--green-bg);color:var(--green)}
.dots{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.dlabel{font-size:14px;color:var(--muted);margin-right:4px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:15px;color:var(--muted)}
.mailfix{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--red-bg);border-radius:var(--radius);padding:12px 14px;font-size:15px}
.mailfix .lbl{font-size:13px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mailfix p{margin:2px 0 0}
.old{text-decoration:line-through;text-decoration-color:var(--red);overflow-wrap:anywhere}
.note.paper{background:var(--amber-bg);color:var(--amber);border-radius:var(--radius);padding:10px 12px}
.big{width:100%;min-height:58px;border:0;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.big:active{transform:scale(.985)}
.big.alt{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.big svg{width:22px;height:22px}
.done{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--green-bg);color:var(--green);border-radius:var(--radius);min-height:58px;padding:0 8px 0 16px;font-weight:600}
.linkbtn{background:none;border:0;padding:8px;font-size:15px;text-decoration:underline;text-underline-offset:3px;color:inherit}
.contact{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--red-bg);border-radius:var(--radius);padding:12px 14px}
.contact .lbl{font-size:13px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tel{font-variant-numeric:tabular-nums;user-select:all;white-space:nowrap}
.copy{background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px}
.row + .row{border-top:1px solid var(--line)}
.row > div{min-width:0}
.rname{font-weight:600;font-size:17px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:18px;color:var(--muted)}
.foot{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.foot .linkbtn{padding:4px 0;font-size:14px}
.flash{animation:none}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1.6s ease-out}}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}

/* Anmeldung */
.panel{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:var(--radius);padding:20px 16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.h{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field input[inputmode]{min-height:48px;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.code-in{letter-spacing:.35em;font-variant-numeric:tabular-nums;font-size:22px !important;font-weight:600}
.err{color:var(--red);font-size:14px;font-weight:500}
.hint{font-size:14px;color:var(--muted)}
.demo{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.demo-h{font-size:14px;font-weight:600;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

/* Leiste, Hinweis, Blatt */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:rise .22s ease-out}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:12px 12px 0 0;border-top:4px solid var(--brand);padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:grid;gap:14px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-top h3{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.x{background:var(--bg);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:18px;flex:none}
.qr{background:var(--qr-bg);border:1px solid var(--line);border-radius:14px;padding:16px;width:fit-content;margin:0 auto;max-width:100%}
.qr img,.qr canvas{display:block;width:184px;height:184px}
.qrcap{text-align:center;font-size:14px;color:var(--muted);margin-top:-4px}
.parent-note{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.fixed-team{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.check label{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14px;line-height:1.45}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
/* Mannschaft wechseln (nur bei Trainern mit mehreren Mannschaften) */
.teamsw{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.teamsw button{background:transparent;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--pitch-ink)}
.teamsw button[aria-pressed="true"]{background:var(--pitch-ink);color:var(--pitch);border-color:var(--pitch-ink);font-weight:600}
.big:disabled{opacity:.6}
a.big{text-decoration:none;box-sizing:border-box}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
</style>

<header class="top gut" id="hdr"></header>
<main class="gut">
  <div id="login"></div>
  <div id="app" hidden></div>
</main>
<div class="bar gut" id="bar" hidden>
  <div class="col">
    <button class="big alt" type="button" data-action="new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Neues Kind beim Training
    </button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="overlay" id="sheet" hidden>
  <div class="sheet gut" role="dialog" aria-modal="true" aria-labelledby="sheet-h" id="sheet-body"></div>
</div>

  function z(n){ return String(n).padStart(2,'0'); }
  function dateOf(s){ return new Date(s+'T12:00:00'); }
  function fmt(s){ return dateOf(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }
  function fmtLong(s){ return dateOf(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  function first(n){ return String(n).split(' ')[0]; }
  function clock(d){ return z(d.getHours())+':'+z(d.getMinutes()); }

  /* phase: loading | ready | error | denied | expired */
  var state = {phase:'loading', me:null, team:null, kids:[], today:null, loadedAt:null, busy:{}, sheet:null, msg:''};

  var $ = function(id){ return document.getElementById(id); };
  function kid(id){ for (var i=0;i<state.kids.length;i++) if (state.kids[i].id===id) return state.kids[i]; return null; }
  function team(){ var ts=state.me?state.me.teams:[]; for (var i=0;i<ts.length;i++) if (ts[i].id===state.team) return ts[i]; return null; }

  /* ---------- Server ---------- */
  function ApiError(kind, status, body){ this.kind=kind; this.status=status; this.body=body||{}; }
  function api(method, path, data){
    var opts = {method:method, credentials:'same-origin', redirect:'manual', headers:{'Accept':'application/json'}};
    if (data !== undefined){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(data); }
    return fetch(path, opts)
      .then(function(res){
        /* Abgelaufene Access-Sitzung: Cloudflare leitet auf die Login-Seite um */
        if (res.type==='opaqueredirect' || res.status===401) throw new ApiError('expired', res.status);
        return res.json().catch(function(){ return {}; }).then(function(body){
          if (!res.ok) throw new ApiError('http', res.status, body);
          return body;
        });
      }, function(){ throw new ApiError('offline', 0); });
  }

  function loadMe(){
    state.phase='loading'; render();
    api('GET','/api/me').then(function(me){
      state.me=me; if (me.max) MAX=me.max; state.today=me.today;
      var saved=null; try { saved=localStorage.getItem('pt-team'); } catch(e){}
      state.team = me.teams.some(function(t){return t.id===saved;}) ? saved : me.teams[0].id;
      return loadKids();
    }).catch(fail);
  }
  function loadKids(quiet){
    if (!quiet){ state.phase='loading'; render(); }
    return api('GET','/api/kids?team='+encodeURIComponent(state.team)).then(function(b){
      state.kids=b.kids; state.today=b.today; state.loadedAt=new Date(); state.phase='ready'; render();
    }).catch(function(e){ if (quiet && e.kind==='offline'){ toast('Keine Verbindung. Die Liste ist vom '+clock(state.loadedAt)+' Uhr.'); return; } fail(e); });
  }
  function fail(e){
    if (e.kind==='expired'){ state.phase='expired'; }
    else if (e.kind==='http' && e.status===403 && e.body.error==='unknown_trainer'){ state.phase='denied'; state.msg=e.body.message; }
    else { state.phase='error'; state.msg = e.kind==='offline' ? 'Keine Verbindung zum Internet. Bitte prüfen und nochmal versuchen.' : (e.body.message || 'Da ist etwas schiefgegangen. Bitte nochmal versuchen.'); }
    render();
  }

  /* ---------- Render ---------- */
  function render(){
    var inApp = state.phase==='ready';
    $('login').hidden = inApp; $('app').hidden = !inApp; $('bar').hidden = !inApp;
    renderHeader();
    if (inApp) renderApp(); else renderStatus();
  }

  function crest(){ return '<img class="crest" alt="Wappen ESC Rellinghausen 06" src="'+LOGO+'">'; }

  function renderHeader(){
    var t = team();
    if (state.phase!=='ready' || !t){
      $('hdr').innerHTML = '<div class="col hdr-in"><div class="eyebrow">'+crest()+'ESC Rellinghausen 06</div><h1>Probetraining</h1><div class="sub">Die App für Trainerinnen und Trainer</div></div>';
      return;
    }
    var list = state.kids;
    var nProbe = list.filter(function(k){return k.status==='probe' && k.count<MAX}).length;
    var nLimit = list.filter(function(k){return k.status==='probe' && k.count>=MAX}).length;
    var nAntrag = list.filter(function(k){return k.status==='antrag'}).length;
    var nMember = list.filter(function(k){return k.status==='mitglied'||k.status==='spielberechtigt'}).length;
    var teams = state.me.teams;
    $('hdr').innerHTML =
      '<div class="col hdr-in">'+
        '<div class="eyebrow">'+crest()+'ESC Rellinghausen 06</div>'+
        '<h1>'+esc(t.name)+'</h1>'+
        (t.ageClass||t.trainer ? '<div class="sub">'+esc([t.ageClass, t.trainer?'Trainer: '+t.trainer:''].filter(Boolean).join(' · '))+'</div>' : '')+
        '<div class="sub">Training heute · '+esc(fmtLong(state.today))+'</div>'+
        '<button class="logout" type="button" data-action="logout">Abmelden</button>'+
        (teams.length>1 ? '<div class="teamsw" role="group" aria-label="Mannschaft wählen">'+teams.map(function(x){
          return '<button type="button" data-action="team" data-team="'+esc(x.id)+'" aria-pressed="'+(x.id===state.team)+'">'+esc(x.name)+'</button>';
        }).join('')+'</div>' : '')+
        '<div class="tally">'+
          '<span class="tchip"><i class="d d-red"></i>'+nProbe+' im Probetraining</span>'+
          (nLimit?'<span class="tchip"><i class="d d-stop"></i>'+nLimit+' Limit erreicht</span>':'')+
          '<span class="tchip"><i class="d d-amber"></i>'+nAntrag+' Antrag</span>'+
          '<span class="tchip"><i class="d d-green"></i>'+nMember+' Mitglied</span>'+
        '</div>'+
      '</div>';
  }

  /* Laden, Fehler, kein Zugang – im Stil des früheren Anmelde-Panels */
  function renderStatus(){
    var p = state.phase, html;
    if (p==='loading'){
      html = panel('Einen Moment …', '<p class="muted" role="status">Deine Mannschaft wird geladen.</p>');
    } else if (p==='expired'){
      html = panel('Bitte neu anmelden', '<p class="muted">Deine Anmeldung ist abgelaufen. Du bekommst gleich einen neuen Code per E-Mail.</p>'+
        '<button class="big" type="button" data-action="reload">Neu anmelden</button>');
    } else if (p==='denied'){
      html = panel('Kein Zugang', '<p class="muted">'+esc(state.msg)+'</p>'+
        '<div><button class="linkbtn" type="button" data-action="logout">Mit anderer E-Mail-Adresse anmelden</button></div>');
    } else {
      html = panel('Das hat nicht geklappt', '<p class="muted">'+esc(state.msg)+'</p>'+
        '<button class="big" type="button" data-action="retry">Nochmal versuchen</button>');
    }
    $('login').innerHTML = '<div class="col stack">'+html+'</div>';
  }
  function panel(h, body){ return '<div class="panel"><h2 class="h">'+esc(h)+'</h2>'+body+'</div>'; }

  /* Antragsmail kam zurück: Trainer soll die richtige Adresse erfragen */
  function mailfix(k){
    if (!k.emailProblem) return '';
    var old = k.emailProblem.email;
    return '<div class="mailfix"><div><div class="lbl">E-Mail unzustellbar</div>'+
      '<p>Der Mitgliedsantrag kam zurück'+(old ? ' (<span class="old">'+esc(old)+'</span>)' : '')+'. Bitte bei den Eltern die richtige Adresse erfragen.</p></div>'+
      '<button class="copy" type="button" data-action="mailfix" data-id="'+esc(k.id)+'">E-Mail korrigieren</button></div>';
  }

  function card(k){
    var limit = k.count>=MAX, att = k.attendedToday, busy = state.busy[k.id];
    var dots = Array.from({length:MAX},function(_,j){return j+1}).map(function(i){ return '<span class="dot'+(i<=k.count?' on':'')+'">'+i+'</span>'; }).join('');
    var pill = limit ? '<span class="pill t-stop">Limit erreicht</span>' : '<span class="pill t-probe">Probetraining '+k.count+'/'+MAX+'</span>';
    var paper = !!k.paperApplication, paperDue = paper && k.count>=2;
    var note = limit ? 'Alle '+MAX+' Probetrainings genutzt. Weiter mittrainieren nur mit Mitgliedsantrag.' + (paper ? ' Die Eltern haben keine E-Mail – Antrag auf Papier mitgeben.' : '')
      : paperDue ? '<strong>Bitte den Mitgliedsantrag auf Papier mitgeben</strong> – die Eltern haben keine E-Mail.'
      : paper ? 'Keine E-Mail: Nach dem 2. Training den Mitgliedsantrag auf Papier mitgeben.'
      : (k.count>=2 ? 'Der Mitgliedsantrag ist automatisch per Mail an die Eltern gegangen.'
      : 'Nach dem 2. Training bekommen die Eltern den Mitgliedsantrag automatisch per Mail.');
    var c = k.contact;
    var contact = (limit && c) ?
      '<div class="contact"><div><div class="lbl">Eltern ansprechen</div><strong>'+esc(c.parent||'Eltern')+'</strong> · <span class="tel" id="tel-'+esc(k.id)+'">'+esc(c.phone||'keine Nummer angegeben')+'</span></div>'+
      (c.phone ? '<button class="copy" type="button" data-action="copy" data-id="'+esc(k.id)+'">Nummer kopieren</button>' : '')+'</div>' : '';
    var action = att ?
      '<div class="done"><span>✓ Heute eingetragen</span><button class="linkbtn" type="button" data-action="undo" data-id="'+esc(k.id)+'"'+(busy?' disabled':'')+'>'+(busy?'Wird zurückgenommen …':'Rückgängig')+'</button></div>'
      : (limit ? '' : '<button class="big" type="button" data-action="attend" data-id="'+esc(k.id)+'"'+(busy?' disabled aria-busy="true"':'')+'>'+(busy?'Wird eingetragen …':'War heute da')+'</button>');
    return '<article class="card'+(limit?' is-limit':'')+'" id="k-'+esc(k.id)+'">'+
      '<div class="card-head"><div><div class="name">'+esc(k.name)+'</div>'+
      '<div class="meta">'+(k.jg?'Jg. '+esc(k.jg)+' · ':'')+(k.last ? 'zuletzt '+(k.last===state.today?'heute':esc(fmt(k.last))) : 'noch kein Training')+'</div></div>'+pill+'</div>'+
      '<div class="dots" role="img" aria-label="'+k.count+' von '+MAX+' Probetrainings"><span class="dlabel">Probetrainings</span>'+dots+'</div>'+
      (k.emailProblem && !limit ? '' : '<p class="note'+(paperDue && !limit ? ' paper' : '')+'">'+note+'</p>')+mailfix(k)+contact+action+'</article>';
  }

  var ROWS = {
    antrag:['Antrag liegt vor','t-amber','Antrag ist bei der Verwaltung'],
    mitglied:['Mitglied','t-green','In DFBnet erfasst, Pass beantragt'],
    spielberechtigt:['Spielberechtigt','t-green','Pass liegt vor, darf auch spielen']
  };
  var ORDER = {antrag:0, mitglied:1, spielberechtigt:2};

  function renderApp(){
    var list = state.kids;
    var byName = function(a,b){ return a.name.localeCompare(b.name,'de'); };
    var probe = list.filter(function(k){return k.status==='probe'}).sort(byName);
    var angem = list.filter(function(k){return ROWS[k.status]}).sort(function(a,b){ return (ORDER[a.status]-ORDER[b.status]) || byName(a,b); });
    $('app').innerHTML =
      '<div class="col stack">'+
        '<section><h2 class="sec">Im Probetraining <span class="n">'+probe.length+'</span></h2>'+
          (probe.length ? '<div class="cards">'+probe.map(card).join('')+'</div>'
            : '<div class="empty">Gerade ist niemand im Probetraining. Kommt ein neues Kind, tippe unten auf „Neues Kind beim Training“.</div>')+
        '</section>'+
        '<section><h2 class="sec">Angemeldet <span class="n">'+angem.length+'</span></h2>'+
          '<p class="secsub">Alle hier dürfen mittrainieren.</p>'+
          (angem.length ? '<div class="rows">'+angem.map(function(k){
            var r=ROWS[k.status];
            return '<div class="row"><div><div class="rname">'+esc(k.name)+'</div><div class="meta">'+r[2]+'</div></div><span class="pill '+r[1]+'">'+r[0]+'</span></div>';
          }).join('')+'</div>' : '<div class="empty">Noch niemand angemeldet.</div>')+
          '<p class="small muted">Den Status ändert die Verwaltung, sobald der Antrag da ist oder das Kind in DFBnet erfasst ist. Du bekommst dann eine Mail.</p>'+
        '</section>'+
        '<footer class="foot">Stand '+clock(state.loadedAt)+' Uhr. '+
          '<button class="linkbtn" type="button" data-action="refresh">Aktualisieren</button></footer>'+
      '</div>';
  }

  /* ---------- Neues Kind ---------- */
  function formUrl(t){ return CFG.formUrlFor ? CFG.formUrlFor(t) : ''; }
  /* Gleiches Formular, auf dem Trainer-Handy geöffnet (Hinweis „Handy den Eltern geben“) */
  function viaTrainer(u){ return u.indexOf('#') >= 0 ? u : u + (u.indexOf('?') >= 0 ? '&' : '?') + 'via=trainer'; }
  function renderMailSheet(){
    var k = kid(state.mailKid), b = $('sheet-body');
    if (!k){ closeSheet(); return; }
    var old = k.emailProblem && k.emailProblem.email;
    b.innerHTML =
      '<div class="sheet-top"><h3 id="sheet-h">E-Mail korrigieren</h3><button class="x" type="button" data-action="close" aria-label="Schließen">✕</button></div>'+
      '<p>Die Antragsmail für <strong>'+esc(k.name)+'</strong> kam zurück'+(old ? ':<br><span class="old">'+esc(old)+'</span>' : '.')+'</p>'+
      '<div class="field"><label for="m-email">Richtige E-Mail der Eltern</label><input id="m-email" type="email" inputmode="email" autocomplete="off" maxlength="120"></div>'+
      '<div class="field"><label for="m-email2">E-Mail wiederholen</label><input id="m-email2" type="email" inputmode="email" autocomplete="off" maxlength="120"><div class="err" id="m-err" hidden></div></div>'+
      '<button class="big" type="button" data-action="mailsave" data-id="'+esc(k.id)+'">Speichern und Antrag neu senden</button>'+
      '<div class="or">Eltern haben keine E-Mail?</div>'+
      '<button class="big alt" type="button" data-action="mailpaper" data-id="'+esc(k.id)+'">Antrag auf Papier geben</button>';
  }
  function openMailSheet(id){ state.sheet='mail'; state.mailKid=id; renderMailSheet(); $('sheet').hidden=false; document.body.classList.add('noscroll'); var f=$('m-email'); if(f) f.focus(); }
  function mailErr(msg){ var e=$('m-err'); if(e){ e.textContent=msg; e.hidden=!msg; } }
  document.addEventListener('input', function(e){ if (e.target.id==='m-email' || e.target.id==='m-email2') mailErr(''); });
  function saveMail(id, paper){
    if (state.busy[id]) return;
    var data;
    if (paper) data = {paper:true};
    else {
      var a = $('m-email').value.trim(), c = $('m-email2').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a)){ mailErr('Bitte eine gültige E-Mail-Adresse eintragen.'); return; }
      if (a.toLowerCase() !== c.toLowerCase()){ mailErr('Die beiden Adressen stimmen nicht überein.'); return; }
      data = {email:a};
    }
    state.busy[id] = true;
    api('POST','/api/kids/'+encodeURIComponent(id)+'/email', data).then(function(b){
      delete state.busy[id]; replaceKid(b.kid); closeSheet(); render();
      toast(paper ? 'Gespeichert. Bitte gib den Eltern von '+first(b.kid.name)+' den Mitgliedsantrag auf Papier mit.'
                  : 'Gespeichert. Der Mitgliedsantrag geht jetzt automatisch an '+data.email+'.');
    }).catch(function(e){
      delete state.busy[id];
      if (e.kind==='expired'){ closeSheet(); fail(e); return; }
      if (e.body && e.body.kid){ replaceKid(e.body.kid); render(); }
      mailErr(e.kind==='offline' ? 'Keine Verbindung – nichts gespeichert. Bitte nochmal versuchen.' : (e.body.message || 'Das hat nicht geklappt. Bitte nochmal versuchen.'));
    });
  }

  function renderSheet(){
    var t = team(), b = $('sheet-body'), url = formUrl(t);
    var top = '<div class="sheet-top"><h3 id="sheet-h">Neues Kind anmelden</h3><button class="x" type="button" data-action="close" aria-label="Schließen">✕</button></div>';
    if (!url){
      b.innerHTML = top +
        '<div class="parent-note">Das Anmeldeformular für Eltern wird gerade eingerichtet.</div>'+
        '<p>Bis dahin: Bitte Name des Kindes, Name und Telefonnummer eines Elternteils notieren und an die Jugendleitung geben. Das Kind erscheint dann in deiner Liste.</p>';
      return;
    }
    b.innerHTML = top +
      '<p>Die Eltern scannen den Code mit der Handykamera und füllen das Formular aus. Das dauert etwa 2 Minuten. Danach steht das Kind in deiner Liste mit Probetraining 1 von '+MAX+'.</p>'+
      '<div class="qr" id="qr"></div>'+
      '<div class="qrcap">Formular für die '+esc(t.name)+' · Mannschaft ist schon ausgewählt</div>'+
      '<div class="or">Eltern ohne Handy?</div>'+
      '<a class="big alt" href="'+esc(viaTrainer(url))+'" target="_blank" rel="noopener">Auf meinem Handy öffnen</a>'+
      '<p class="small muted">Gib dein Handy den Eltern zum Ausfüllen – die Einwilligung müssen die Eltern selbst geben. Danach steht das Kind wie beim Scannen in deiner Liste.</p>'+
      '<p class="small muted">Neue Kinder erscheinen nach kurzer Zeit in der Liste – sonst unten auf „Aktualisieren“ tippen.</p>'+
      '<div><a class="linkbtn" href="aushang.html?team='+encodeURIComponent(t.name)+'&amp;id='+encodeURIComponent(t.id)+'" target="_blank" rel="noopener">Aushang mit diesem Code für den Platz öffnen</a></div>';
    var box = $('qr');
    if (window.QRCode){
      try { new QRCode(box,{text:url,width:184,height:184,colorDark:'#141414',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
      catch(e){ box.textContent = url; }
    } else { box.textContent = url; }
  }
  function openSheet(){ state.sheet='qr'; renderSheet(); $('sheet').hidden=false; document.body.classList.add('noscroll'); var x=$('sheet').querySelector('.x'); if(x) x.focus(); }
  function closeSheet(){ state.sheet=null; $('sheet').hidden=true; document.body.classList.remove('noscroll'); }

  /* ---------- Aktionen ---------- */
  function replaceKid(k){ for (var i=0;i<state.kids.length;i++) if (state.kids[i].id===k.id) state.kids[i]=k; }
  function act(id, kind){
    if (state.busy[id]) return; /* kein Doppel-Tipp */
    var k = kid(id); if (!k) return;
    state.busy[id]=true; render();
    api('POST','/api/kids/'+encodeURIComponent(id)+'/'+kind).then(function(b){
      delete state.busy[id]; replaceKid(b.kid); render();
      var n = b.kid;
      if (kind==='undo') toast('Eintrag für '+first(n.name)+' zurückgenommen.');
      else if (n.count===2 && n.paperApplication) toast('Eingetragen! Bitte gib den Eltern von '+first(n.name)+' jetzt den Mitgliedsantrag auf Papier mit.');
      else if (n.count===2) toast('Eingetragen! Die Eltern von '+first(n.name)+' bekommen jetzt automatisch den Mitgliedsantrag per Mail.');
      else if (n.count>=MAX) toast('Das war das '+MAX+'. Probetraining von '+first(n.name)+'. Ab jetzt nur mit Mitgliedsantrag.');
      else toast('Eingetragen! '+first(n.name)+' ist bei Probetraining '+n.count+' von '+MAX+'.');
    }).catch(function(e){
      delete state.busy[id];
      if (e.kind==='expired'){ fail(e); return; }
      if (e.body && e.body.kid) replaceKid(e.body.kid);
      if (e.kind==='http' && e.status===404){ state.kids = state.kids.filter(function(x){ return x.id!==id; }); }
      render();
      toast(e.kind==='offline' ? 'Keine Verbindung – nichts eingetragen. Bitte nochmal tippen.' : (e.body.message || 'Das hat nicht geklappt. Bitte nochmal versuchen.'));
    });
  }
  function copy(id){
    var k=kid(id), el=$('tel-'+id); if(!k || !k.contact || !el) return;
    function sel(){ try{ var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Nummer ist markiert und kann kopiert werden.'); }catch(e){} }
    try { navigator.clipboard.writeText(k.contact.phone).then(function(){ toast('Nummer kopiert.'); }, sel); } catch(e){ sel(); }
  }
  var tt;
  function toast(msg){
    var el=$('toast'); el.textContent=msg; el.hidden=false;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(tt); tt=setTimeout(function(){ el.hidden=true; },4200);
  }

  document.addEventListener('click', function(e){
    if (e.target.id==='sheet'){ closeSheet(); return; }
    var b=e.target.closest('[data-action]'); if(!b || b.disabled) return;
    var a=b.dataset.action, id=b.dataset.id;
    switch(a){
      case 'logout': try{ localStorage.removeItem('pt-team'); }catch(_){} location.href=LOGOUT_URL; break;
      case 'reload': location.reload(); break;
      case 'retry': if (state.me) loadKids(); else loadMe(); break;
      case 'refresh': loadKids(true).then(function(){ if (state.phase==='ready') toast('Liste ist aktuell.'); }); break;
      case 'team':
        state.team=b.dataset.team; state.kids=[];
        try{ localStorage.setItem('pt-team',state.team); }catch(_){}
        loadKids(); window.scrollTo(0,0); break;
      case 'attend': act(id,'attend'); break;
      case 'undo': act(id,'undo'); break;
      case 'copy': copy(id); break;
      case 'mailfix': openMailSheet(id); break;
      case 'mailsave': saveMail(id, false); break;
      case 'mailpaper': saveMail(id, true); break;
      case 'new': openSheet(); break;
      case 'close': closeSheet(); break;
    }
  });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && state.sheet) closeSheet(); });
  /* Zurück in die App (z. B. nach dem Sperrbildschirm): Liste auffrischen, wenn sie älter als eine Minute ist */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState==='visible' && state.phase==='ready' && Date.now()-state.loadedAt.getTime()>REFRESH_MS) loadKids(true);
  });

  loadMe();
})();
</script>

</body>
</html>
